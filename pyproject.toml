[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "botkit-delivery"
version = "1.0.0"
description = "Telegram bot for order and delivery tracking"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "aiogram>=3.30",
    "aiosqlite>=0.19",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "aiohttp>=3.9",
    "requests>=2.31",
]
e2e = [
    "telethon>=1.34",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "SIM"]
ignore = ["SIM105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=52"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "no_req: fully offline, no external HTTP/Telegram requests",
    "req: requires network and/or a real external service",
    "unit: isolated unit test",
    "integration: local component/integration test",
    "webhook: webhook endpoint test",
    "e2e: real Telegram E2E via MTProto",
    "serial: must not be parallelized via xdist",
]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 52
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.coverage.xml]
output = "coverage.xml"
