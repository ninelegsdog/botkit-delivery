# Reusable CI workflow - place in .github/workflows/ci-reusable.yml
name: Reusable CI

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      run-mypy:
        required: false
        type: boolean
        default: true
      run-pytest:
        required: false
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b5c6ecbdb5895b57d5622c74b8e653c2f42d69e  # v5.4.0
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - if: ${{ inputs.run-mypy }}
        run: mypy src/
      - if: ${{ inputs.run-pytest }}
        run: pytest --cov=src --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      
      # Gitleaks
      - uses: gitleaks/gitleaks-action@3b2f6e4c4c1b8c4d5e6f7a8b9c0d1e2f3a4b5c6d  # v2.6.1
      
      # Trivy filesystem scan
      - uses: aquasecurity/trivy-action@1f3e9c1e8a4a8f3b8e7c9d0a1b2c3d4e5f6a7b8c9  # v0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@44c1b5c7d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0  # v3.28.0
        if: always()
        with:
          sarif_file: "trivy-fs.sarif"
      
      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@0e8c7e5a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e  # v0.17.0
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"
      - name: Upload SBOM
        uses: github/dependency-graph-action@v1
        with:
          path: "sbom.spdx.json"
